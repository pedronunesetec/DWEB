<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 9</title>
</head>
<body>

    <h1>Testando Funções com Script Externo</h1>

    
    <div>
        <h3>1. Encontrar o Maior</h3>
        <input type="number" id="m1" placeholder="Num 1">
        <input type="number" id="m2" placeholder="Num 2">
        <input type="number" id="m3" placeholder="Num 3">
        
        <button onclick="dispararMaior()">Calcular</button>
    </div>

    
    <div>
        <h3>2. Ordenar 3 Números</h3>
        <input type="number" id="o1" placeholder="Num 1">
        <input type="number" id="o2" placeholder="Num 2">
        <input type="number" id="o3" placeholder="Num 3">
        <button onclick="dispararOrdenar()">Ordenar</button>
    </div>

    
    <div>
        <h3>3. Verificar Palíndromo</h3>
        <input type="text" id="palavra" placeholder="Digite uma palavra">
        <button onclick="dispararPalindromo()">Verificar</button>
    </div>

    
    <div>
        <h3>4. Verificar Par</h3>
        <input type="number" id="numPar" placeholder="Digite um número">
        <button onclick="dispararPar()">Verificar</button>
    </div>

    
    <div>
        <h3>5. Calcular Média</h3>
        <input type="number" id="med1" placeholder="Num 1">
        <input type="number" id="med2" placeholder="Num 2">
        <input type="number" id="med3" placeholder="Num 3">
        <button onclick="dispararMedia()">Calcular Média</button>
    </div>

    <script src="Funcoes.js"></script>
</body>
</html>
